[build-system]
# 77 is where setuptools learned the PEP 639 licence fields below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jitsi-audio-bridge"
description = "Capture per-participant Jitsi audio, then transcribe, summarise and email it"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
keywords = ["jitsi", "jvb", "whisper", "ollama", "transcription", "meeting"]
# AGPL-3.0-only, and deliberately not "or later": whoever runs a modified copy
# as a network service has to offer its users the source, and the copyright
# holder keeps the option of licensing it otherwise.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Communications :: Conferencing",
]
dependencies = [
    "websockets>=13",
    "requests>=2.31",
]

[project.optional-dependencies]
# Archiving the recordings and video Jibri produced needs an S3 client. It is
# an extra rather than a dependency because most deployments never configure
# an endpoint, and boto3 is a large thing to install for something unused.
s3 = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
jitsi-audio-bridge = "jitsi_audio_bridge.daemon:main"

[tool.setuptools.dynamic]
version = { attr = "jitsi_audio_bridge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The mail's structure and its stylesheet are read at send time rather than
# compiled in, so they have to travel inside the wheel and the .deb with it.
jitsi_audio_bridge = ["templates/*.html", "templates/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
